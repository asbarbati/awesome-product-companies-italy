name: "Company Submission Form"
description: "Submit company details and references to be added to the README table."
title: "[Company Entry]: "
labels: ["new-entry", "good first issue"]
body:
  - type: markdown
    attributes:
      value: |
        ### Company Submission
        Please fill in the fields below. The requested information corresponds directly to the columns in the README table.

  - type: input
    id: company_name
    attributes:
      label: "Company"
      description: "Enter the official name of the company."
      placeholder: "e.g., Acme Corp"
    validations:
      required: true

  - type: input
    id: business_type
    attributes:
      label: "Business Type"
      description: "Specify the type of business (e.g., B2B, B2C, Agency, Startup, Enterprise)."
      placeholder: "e.g., B2B Software"
    validations:
      required: true

  - type: input
    id: sector
    attributes:
      label: "Sector"
      description: "Indicate the industry or sector."
      placeholder: "e.g., Fintech, Healthcare, E-commerce"
    validations:
      required: true

  - type: input
    id: website_link
    attributes:
      label: "Website link"
      description: "URL of the company's official website."
      placeholder: "https://www.example.com"
    validations:
      required: true

  - type: input
    id: careers_link
    attributes:
      label: "Careers link"
      description: "URL of the careers page or open positions page."
      placeholder: "https://www.example.com/careers"
    validations:
      required: false

  - type: input
    id: linkedin_link
    attributes:
      label: "LinkedIn link"
      description: "URL of the company's LinkedIn profile page."
      placeholder: "https://www.linkedin.com/company/example"
    validations:
      required: false

  - type: input
    id: additional_comment
    attributes:
      label: "Additional Comment"
      description: "Additional comment"
      placeholder: "Your supercomment"
    validations:
      required: false